<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web-WAS 2-Tier</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 48px auto; padding: 0 16px; color: #1f2328; }
    .tiers { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 24px; }
    .card { border: 1px solid #d0d7de; border-radius: 10px; padding: 16px; }
    .card h2 { margin: 0 0 8px; font-size: 18px; }
    .ok { color: #1a7f37; } .err { color: #cf222e; }
    pre { background: #f6f8fa; padding: 12px; border-radius: 8px; overflow-x: auto; }
    @media (max-width: 560px) { .tiers { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>Web-WAS 2-Tier 자동 배포</h1>
  <p>Web 버전: <strong>web-v1</strong></p>

  <div class="tiers">
    <div class="card">
      <h2>🌐 Web (nginx)</h2>
      <p class="ok">정적 파일 응답 정상</p>
      <p>/var/www/html/index.html</p>
    </div>
    <div class="card">
      <h2>⚙️ WAS (Flask)</h2>
      <p id="was-status">호출 중...</p>
      <p>GET /api/hello</p>
    </div>
  </div>

  <h3>WAS 응답</h3>
  <pre id="was-body">-</pre>

  <script>
    fetch('/api/hello')
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(data => {
        document.getElementById('was-status').innerHTML = '<span class="ok">연결 성공 (' + data.version + ')</span>';
        document.getElementById('was-body').textContent = JSON.stringify(data, null, 2);
      })
      .catch(err => {
        document.getElementById('was-status').innerHTML = '<span class="err">연결 실패</span>';
        document.getElementById('was-body').textContent = String(err);
      });
  </script>
</body>
</html>
