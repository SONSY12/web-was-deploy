server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Web: 정적 파일
    root /var/www/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # WAS: /api/ 요청은 Flask(127.0.0.1:5000)로 전달
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
